<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Juba Checker Results</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/1.1.0/modern-normalize.min.css">
    <style>
        body { font-family: 'Fira Mono', 'Consolas', 'Menlo', monospace; background: #181818; color: #e0e0e0; margin: 0; }
        .container { max-width: 700px; margin: 40px auto; background: #222; border-radius: 8px; box-shadow: 0 2px 8px #0008; padding: 32px; }
        h1 { text-align: center; color: #00eaff; }
        .terminal { background: #181818; border-radius: 4px; padding: 16px; min-height: 300px; font-size: 1rem; overflow-y: auto; }
        .actions { text-align: center; margin-bottom: 24px; }
        a.button { background: #0078d4; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 4px; font-size: 1rem; margin: 0 8px; display: inline-block; }
        a.button:hover { background: #005fa3; }
        .valid { color: #00ff00; }
        .invalid { color: #ff4c4c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Live Results</h1>
        <div class="actions">
            <a href="{{ url_for('index') }}" class="button">Back</a>
        </div>
        <div class="terminal" id="terminal"></div>
    </div>
    <script>
        const terminal = document.getElementById('terminal');
        const eventSource = new EventSource("{{ url_for('stream_results', filename=filename) }}");
        eventSource.onmessage = function(event) {
            let line = event.data;
            let status = line.includes('VALID') ? 'valid' : 'invalid';
            let html = `<div class="${status}">${line}</div>`;
            terminal.innerHTML += html;
            terminal.scrollTop = terminal.scrollHeight;
        };
        eventSource.onerror = function() {
            eventSource.close();
        };
    </script>
</body>
</html>

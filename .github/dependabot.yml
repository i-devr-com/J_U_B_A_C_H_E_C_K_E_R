version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - juba-team
    assignees:
      - juba-team
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - security
      - python
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    milestone: Security Updates
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
    open-pull-requests-limit: 3
    reviewers:
      - juba-team
    assignees:
      - juba-team
    commit-message:
      prefix: ci
      include: scope
    labels:
      - github-actions
      - ci
      - security
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    reviewers:
      - juba-team
    commit-message:
      prefix: docker
      include: scope
    labels:
      - docker
      - security
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '09:00'
    open-pull-requests-limit: 3
    reviewers:
      - juba-team
    commit-message:
      prefix: frontend
      include: scope
    labels:
      - npm
      - frontend
      - security
    versioning-strategy: increase
    allow:
      - dependency-type: direct
      - dependency-type: indirect
security-updates:
  - package-ecosystem: pip
    directory: /
    open-pull-requests-limit: 10
    auto-merge: true
    requirements-update-strategy: widen
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 5
    auto-merge: true
  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 5
    auto-merge: false
groups:
  flask-dependencies:
    patterns:
      - flask*
      - werkzeug*
      - jinja2*
    applies-to: version-updates
    update-types:
      - minor
      - patch
  security-dependencies:
    patterns:
      - urllib3*
      - requests*
      - certifi*
    applies-to: version-updates
    update-types:
      - minor
      - patch
  testing-dependencies:
    patterns:
      - pytest*
      - coverage*
      - black*
      - flake8*
    applies-to: version-updates
    update-types:
      - minor
      - patch
  pip:
    type: python-index
    url: 'https://pypi.org/simple'
    replaces-base: true
  npm:
    type: npm-registry
    url: 'https://registry.npmjs.org'
    replaces-base: true
notify:
  'on': pull_request_created
  teams:
    - juba-team/security
  individuals:
    - security-lead

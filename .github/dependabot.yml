
# Dependabot configuration for Juba Checker
# This file configures automated dependency updates for enhanced security

version: 2
updates:

  # Track Python dependencies from requirements.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - ""  # Replace with actual team/username
    assignees:
      - "hak193"  # Replace with actual team/username
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
      - "python"
    allow:
      # Allow both direct and indirect dependencies
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    milestone: "Security Updates"

  # Track GitHub Actions for CI/CD security
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 3
    reviewers:
      - "hak193"  # Replace with actual team/username
    assignees:
      - ""  # Replace with actual team/username
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "ci"
      - "security"

  # Track Docker dependencies if Docker is used
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "juba-team"  # Replace with actual team/username
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "docker"
      - "security"

  # Track npm dependencies for web interface assets
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - ""  # Replace with actual team/username
    commit-message:
      prefix: "frontend"
      include: "scope"
    labels:
      - "npm"
      - "frontend"
      - "security"
    versioning-strategy: "increase"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

# Security configuration for critical updates
security-updates:
  # Enable security updates for all ecosystems
  - package-ecosystem: "pip"
    directory: "/"
    open-pull-requests-limit: 10
    # Auto-merge minor security updates
    auto-merge: true
    # Require approval for major security updates
    requirements-update-strategy: "widen"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    auto-merge: true

  - package-ecosystem: "docker"
    directory: "/"
    open-pull-requests-limit: 5
    auto-merge: false  # Manual review for Docker updates

# Group updates for better organization
groups:
  # Group Flask-related dependencies
  flask-dependencies:
    patterns:
      - "flask*"
      - "werkzeug*"
      - "jinja2*"
    applies-to: "version-updates"
    update-types:
      - "minor"
      - "patch"

  # Group security-related dependencies
  security-dependencies:
    patterns:
      - "urllib3*"
      - "requests*"
      - "certifi*"
    applies-to: "version-updates"
    update-types:
      - "minor"
      - "patch"

  # Group testing dependencies
  testing-dependencies:
    patterns:
      - "pytest*"
      - "coverage*"
      - "black*"
      - "flake8*"
    applies-to: "version-updates"
    update-types:
      - "minor"
      - "patch"

# Custom configuration for specific dependencies
 registries:
  # Use PyPI for Python packages
  pip:
    type: "python-index"
    url: "https://pypi.org/simple"
    replaces-base: true

  # Use npm registry for JavaScript packages
  npm:
    type: "npm-registry"
    url: "https://registry.npmjs.org"
    replaces-base: true

# Notification settings
notify:
  # Notify on PR creation
  on: "pull_request_created"
  # Notify teams/individuals
  teams:
    - "juba-team/security"
  individuals:
    - "security-lead"
